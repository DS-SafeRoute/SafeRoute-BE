server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: false

saferoute:
  ai-service:
    # AI가 아직 배포되지 않았어도 BE 자체는 먼저 실행할 수 있다.
    base-url: ${AI_SERVICE_BASE_URL:http://ai:8000}
