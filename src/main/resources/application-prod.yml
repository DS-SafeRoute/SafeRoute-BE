spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # EC2 실배포 시점엔 validate로 바꾸기
    properties:
      hibernate:
        format_sql: false

cloud:
  aws:
    region: ${AWS_REGION:us-east-2}
    s3:
      bucket: ${S3_BUCKET}
