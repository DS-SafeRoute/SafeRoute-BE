spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # EC2 실배포 시점엔 validate로 바꾸기
    properties:
      hibernate:
        format_sql: false

# CORS 허용 오리진(프론트가 뜨는 주소). 비밀값이 아니라 여기 직접 나열한다.
# SecurityConfig 의 setAllowedOrigins 는 정확 일치라 와일드카드가 통하지 않는다 → 주소를 그대로 적는다.
# 커스텀 도메인 연결 전후 주소를 모두 넣어둬서, 프론트가 도메인을 붙일 때 백엔드 재배포가 필요 없게 한다.
app:
  cors:
    allowed-origins:
      - http://localhost:5173         # Vite 로컬 프론트 (배포된 API로 개발)
      - http://localhost:3000
