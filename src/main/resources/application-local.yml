spring:
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

saferoute:
  ai-service:
    # IDE에서 BE를 직접 실행할 때 AI는 Windows localhost:8001을 사용한다.
    # Docker Compose에서는 AI_SERVICE_BASE_URL=http://ai:8000으로 덮어쓴다.
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}