spring:
  application:
    name: SafeRoute

  profiles:
    default: local

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://ds-saferoute.site,https://dev-safe-route-fe.vercel.app}

jwt:
  secret: ${JWT_SECRET}
  issuer: saferoute
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}

aws:
  region: ${AWS_REGION:us-east-2}

  s3:
    bucket: ${S3_BUCKET}
    presigned-url-expiration: 1m

  dynamodb:
    table-name: ${DYNAMODB_TABLE:saferoute-telemetry}
    gsi1-name: ${DYNAMODB_GSI1_NAME:GSI1}

saferoute:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
