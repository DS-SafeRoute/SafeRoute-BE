spring:
  application:
    name: SafeRoute

  profiles:
    default: local

  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  cors:
    # 콤마로 여러 Origin을 지정할 수 있다. 운영 프론트 배포 후 환경변수에 HTTPS Origin을 추가한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
  secret: ${JWT_SECRET}
  issuer: saferoute
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1h}

aws:
  region: ${AWS_REGION:us-east-2}

  s3:
    bucket: ${S3_BUCKET:project10-87-ohio-s3}
    presigned-url-expiration: 1m

  dynamodb:
    table-name: ${DYNAMODB_TABLE:saferoute-telemetry}

saferoute:
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never