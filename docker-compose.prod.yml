services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saferoute-be
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE:-saferoute-telemetry}

    restart: unless-stopped