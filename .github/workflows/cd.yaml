name: CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-develop
  cancel-in-progress: false

env:
  IMAGE_NAME: saferoute-be

jobs:
  test:
    name: test-before-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon

  build-and-push:
    name: build-and-push
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:develop
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy-to-ec2
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/saferoute
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/saferoute ~/.ssh/known_hosts

      - name: Upload production Compose file
        run: |
          scp -i ~/.ssh/saferoute \
            docker-compose.prod.yml \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:/home/${{ vars.EC2_USER }}/saferoute/docker-compose.prod.yml"

      - name: Pull image and restart application
        run: |
          ssh -i ~/.ssh/saferoute \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" \
            "cd /home/${{ vars.EC2_USER }}/saferoute && \
             IMAGE_TAG=develop docker compose --env-file .env -f docker-compose.prod.yml pull && \
             IMAGE_TAG=develop docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans"

      - name: Verify deployment
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error \
              "http://${{ vars.EC2_HOST }}:8080/actuator/health"; then
              exit 0
            fi
            echo "Waiting for application... (${attempt}/18)"
            sleep 5
          done

          echo "Deployment health check failed."
          exit 1

      - name: Show application logs on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/saferoute \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" \
            "cd /home/${{ vars.EC2_USER }}/saferoute && \
             docker compose --env-file .env -f docker-compose.prod.yml logs --tail=150 app" || true