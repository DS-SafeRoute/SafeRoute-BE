name: CD

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: EC2 배포
        required: true
        default: be-only
        type: choice
        options:
          - be-only
          - ai-only
          - all

permissions:
  contents: read

concurrency:
  group: saferoute-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.deploy_target }}
    runs-on:
      - self-hosted
      - linux
      - x64

    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout BE repository
        uses: actions/checkout@v6
        with:
          path: SafeRoute-BE
          persist-credentials: false

      - name: Checkout AI floor_analysis
        if: ${{ inputs.deploy_target == 'ai-only' || inputs.deploy_target == 'all' }}
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.AI_REPOSITORY }}
          token: ${{ secrets.AI_REPO_TOKEN }}
          path: SafeRoute-AI
          persist-credentials: false
          sparse-checkout: |
            floor_analysis
          sparse-checkout-cone-mode: true
          lfs: true

      - name: Validate runner environment
        run: |
          set -euo pipefail

          docker --version
          docker compose version

          test -f /opt/saferoute/.env || {
            echo "::error::/opt/saferoute/.env 파일이 없습니다."
            exit 1
          }

      - name: Validate production Compose
        working-directory: SafeRoute-BE
        run: |
          set -euo pipefail

          docker compose \
            --env-file /opt/saferoute/.env \
            -f docker-compose.prod.yml \
            config --quiet

      - name: Deploy BE
        if: ${{ inputs.deploy_target == 'be-only' || inputs.deploy_target == 'all' }}
        working-directory: SafeRoute-BE
        run: |
          set -euo pipefail

          docker compose \
            --env-file /opt/saferoute/.env \
            -f docker-compose.prod.yml \
            up -d --build app

          docker compose \
            --env-file /opt/saferoute/.env \
            -f docker-compose.prod.yml \
            ps app

      - name: Verify BE health
        if: ${{ inputs.deploy_target == 'be-only' || inputs.deploy_target == 'all' }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 24 \
            --retry-delay 5 \
            --retry-connrefused \
            --max-time 10 \
            http://127.0.0.1:8080/actuator/health

      - name: Deploy AI
        if: ${{ inputs.deploy_target == 'ai-only' || inputs.deploy_target == 'all' }}
        working-directory: SafeRoute-BE
        run: |
          set -euo pipefail

          docker compose \
            --env-file /opt/saferoute/.env \
            -f docker-compose.prod.yml \
            up -d --build ai

          docker compose \
            --env-file /opt/saferoute/.env \
            -f docker-compose.prod.yml \
            ps ai

      - name: Wait for AI health
        if: ${{ inputs.deploy_target == 'ai-only' || inputs.deploy_target == 'all' }}
        working-directory: SafeRoute-BE
        run: |
          set -euo pipefail

          container_id="$(
            docker compose \
              --env-file /opt/saferoute/.env \
              -f docker-compose.prod.yml \
              ps -q ai
          )"

          test -n "$container_id" || {
            echo "::error::AI 컨테이너를 찾을 수 없습니다."
            exit 1
          }

          status="starting"

          for attempt in $(seq 1 60); do
            status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$container_id"
            )"

            echo "AI health status: $status ($attempt/60)"

            if [ "$status" = "healthy" ]; then
              break
            fi

            if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ]; then
              docker compose \
                --env-file /opt/saferoute/.env \
                -f docker-compose.prod.yml \
                logs --tail=200 ai
              exit 1
            fi

            sleep 5
          done

          if [ "$status" != "healthy" ]; then
            echo "::error::AI 서비스가 제한 시간 내 healthy 상태가 되지 않았습니다."
            docker compose \
              --env-file /opt/saferoute/.env \
              -f docker-compose.prod.yml \
              logs --tail=200 ai
            exit 1
          fi

      - name: Verify AI endpoint
        if: ${{ inputs.deploy_target == 'ai-only' || inputs.deploy_target == 'all' }}
        working-directory: SafeRoute-BE
        run: |
          set -euo pipefail

          docker compose \
            --env-file /opt/saferoute/.env \
            -f docker-compose.prod.yml \
            exec -T ai \
            python -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read().decode())"

      - name: Show deployment status
        if: always()
        working-directory: SafeRoute-BE
        run: |
          docker compose \
            --env-file /opt/saferoute/.env \
            -f docker-compose.prod.yml \
            ps || true