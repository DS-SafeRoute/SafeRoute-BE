# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko-KR

reviews:
  profile: chill
  high_level_summary: true
  changed_files_summary: true
  request_changes_workflow: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - develop
      - main

    ignore_title_keywords:
      - WIP
      - DO NOT MERGE

  path_instructions:
    - path: "src/main/java/**/*.java"
      instructions: |
        Spring Boot, JPA, Spring Security 관점에서 검토해 주세요.
        트랜잭션 경계, N+1 문제, 관리자 권한 검증, 예외 처리,
        null 가능성, 엔티티 연관관계와 삭제 순서를 중점적으로 확인해 주세요.

    - path: "src/test/**/*.java"
      instructions: |
        테스트가 실제 성공 조건과 실패 조건을 검증하는지 확인해 주세요.
        권한 검증과 예외 상황 테스트 누락을 중점적으로 확인해 주세요.

    - path: "Dockerfile"
      instructions: |
        이미지 크기, 빌드 재현성, 민감정보 포함 여부,
        컨테이너 실행 안정성을 확인해 주세요.

    - path: ".github/workflows/*.yml"
      instructions: |
        GitHub Actions 권한, Secret 노출 가능성,
        테스트 및 배포 실패 처리를 확인해 주세요.